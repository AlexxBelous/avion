name: Deploy to Pantheon

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: themes/NovaTheme/package-lock.json

      - name: Build NovaTheme
        working-directory: ./themes/NovaTheme
        run: |
          npm ci
          npm run build

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PANTHEON_SSH_KEY }}

      - name: Add Pantheon to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 2222 \
            codeserver.dev.7927a4ec-201f-42cf-8298-a085425d0831.drush.in \
            >> ~/.ssh/known_hosts 2>/dev/null

      - name: Clone Pantheon repository
        env:
          PANTHEON_GIT_URL: "ssh://codeserver.dev.7927a4ec-201f-42cf-8298-a085425d0831@codeserver.dev.7927a4ec-201f-42cf-8298-a085425d0831.drush.in:2222/~/repository.git"
        run: |
          git clone \
            --branch master \
            "$PANTHEON_GIT_URL" \
            pantheon-deploy

      - name: Deploy NovaTheme
        run: |
          rm -rf pantheon-deploy/wp-content/themes/NovaTheme
          mkdir -p pantheon-deploy/wp-content/themes/NovaTheme

          rsync -a \
            --exclude="node_modules/" \
            --exclude="dist/" \
            themes/NovaTheme/ \
            pantheon-deploy/wp-content/themes/NovaTheme/

      - name: Deploy plugins
        run: |
          if [ -d "plugins" ]; then
            mkdir -p pantheon-deploy/wp-content/plugins

            rsync -a \
              plugins/ \
              pantheon-deploy/wp-content/plugins/
          else
            echo "No plugins directory in GitHub repository. Skipping plugins."
          fi

      - name: Show deployment changes
        working-directory: ./pantheon-deploy
        run: |
          git status --short

      - name: Commit changes
        working-directory: ./pantheon-deploy
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "bot@github.com"

          git add wp-content/themes/NovaTheme
          git add wp-content/plugins

          if git diff --cached --quiet; then
            echo "No changes to deploy."
            exit 0
          fi

          git commit -m "Deploy NovaTheme from GitHub"

      - name: Push to Pantheon
        working-directory: ./pantheon-deploy
        run: |
          git push origin master
